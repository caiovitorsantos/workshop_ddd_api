name: CI

# Pull requests run it directly; on main it runs as the first stage of cd.yml
# (workflow_call), so a push to main is tested once and deploys only if green.
on:
  pull_request:
  workflow_call:

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # The full suite against a real PostgreSQL, same major version as
  # docker-compose. Integration specs need it: the stock-concurrency spec opens
  # two real connections and relies on SELECT ... FOR UPDATE, which an
  # in-memory database could not prove.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # GitHub sets CI=true, which turns on eager_load in config/environments/test.rb:
      # a file Zeitwerk cannot load fails here rather than in production.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:create db:schema:load

      # The coverage gate (80% line / 70% branch) lives in spec/rails_helper.rb,
      # so a drop below it fails this step on its own.
      - name: Run the test suite
        run: bundle exec rspec --format progress

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore


  # The production image builds, and carries no CRITICAL vulnerability with a
  # fix available. HIGH ones are listed in the run summary without failing:
  # some sit in binaries we do not build (Thruster's Go runtime) and can only
  # wait for an upstream release.
  docker:
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build the production image
        run: docker build -t oficina-api:${{ github.sha }} .

      # The official Trivy image, pinned by digest. Not trivy-action: its setup
      # step runs an install script fetched from Trivy's main branch, which
      # broke our CD on 03/11 without any change on our side.
      - name: Report HIGH vulnerabilities (non-blocking)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" -v trivy-cache:/root/.cache "$TRIVY" image \
            --severity HIGH --ignore-unfixed --format table --output /out/trivy-high.txt \
            "oficina-api:${{ github.sha }}"

      - name: Fail on CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache "$TRIVY" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            "oficina-api:${{ github.sha }}"

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Image scan (Trivy, HIGH, fixed upstream)"
            echo '```'
            cat trivy-high.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
