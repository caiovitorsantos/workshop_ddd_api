# EXAMPLE ONLY — not listed in kustomization.yaml and never applied.
# The real Secret is created by the CD from GitHub Secrets:
#
#   kubectl -n oficina create secret generic oficina-api-secrets \
#     --from-literal=POSTGRES_PASSWORD=... --from-literal=SECRET_KEY_BASE=... \
#     --from-literal=JWT_SECRET=... --from-literal=QUOTE_WEBHOOK_SECRET=... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secrets
  namespace: oficina
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  SECRET_KEY_BASE: generate-with-bin-rails-secret
  JWT_SECRET: generate-with-bin-rails-secret
  QUOTE_WEBHOOK_SECRET: shared-with-the-quote-system
