# Throwaway PostgreSQL for kind only — on AWS the database is RDS. emptyDir:
# deleting the pod deletes the data, which is what a local check wants.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: oficina_api_production }
            - { name: POSTGRES_USER, value: oficina }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: oficina-api-secrets, key: POSTGRES_PASSWORD } }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [ "pg_isready", "-U", "oficina" ] }
            periodSeconds: 3
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
